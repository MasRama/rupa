name: Bug report
description: Something in Rupa does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest feature, command or route that shows the problem.
      render: ts
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Remove tokens and other secrets first.
      render: text
  - type: input
    id: version
    attributes:
      label: Rupa version or commit
      placeholder: v0.2.0 or a commit sha
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: '22.12.0'
    validations:
      required: true
